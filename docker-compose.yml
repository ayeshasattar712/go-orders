services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: goorder
    ports:
      - '5432:5432'
    volumes:
      - goorder_postgres_data:/var/lib/postgresql/data

volumes:
  goorder_postgres_data:
